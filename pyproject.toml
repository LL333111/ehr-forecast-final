[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-forecast"
version = "1.0.0"
description = "A leakage-audited, final LightGBM pipeline for synthetic longitudinal EHR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "duckdb==1.5.6",
    "lightgbm==4.7.0",
    "joblib==1.6.0",
]

[project.optional-dependencies]
train = ["wandb>=0.19,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
ehr-forecast = "ehr_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
